lm:
  api:
    base-url: ${LM_API_BASE_URL:http://localhost:8080}

spring:
  application:
    name: LM-BE
  liquibase:
    contexts: app
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  docker:
    compose:
      skip:
        in-tests: true

logging:
  structured:
    format:
      console: ecs

management:
  server:
    port: 8081
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
      group:
        readiness:
          include: readinessState,db
