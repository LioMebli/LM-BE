spring:
  application:
    name: LM-BE
  liquibase:
    contexts: app
  jpa:
    hibernate:
      ddl-auto: validate
    # A lazy association touched after the service returned is a query the web layer never
    # asked for. Left open, it succeeds and is invisible; closed, it throws where the mistake
    # is. SC-004 is the criterion this protects.
    open-in-view: false
  docker:
    compose:
      skip:
        in-tests: true

logging:
  structured:
    format:
      console: ecs

management:
  server:
    port: 8081
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
      group:
        readiness:
          # Boot's default group is `readinessState` alone, which reports UP with the
          # database unreachable. Removing `db` breaks nothing and no test fails.
          include: readinessState,db
