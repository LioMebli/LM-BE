services:
  postgres:
    image: 'postgres:18-alpine'
    container_name: lm-db
    environment:
      POSTGRES_DB: appdb
      POSTGRES_PASSWORD: password
      POSTGRES_USER: lmuser
    volumes:
      - db_data:/var/lib/postgresql
    ports:
      - '5432:5432'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lmuser -d appdb"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
    db_data: